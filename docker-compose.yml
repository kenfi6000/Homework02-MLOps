services:
  minio:
    image: bitnamilegacy/minio:2025.5.24
    user: "0"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: zeroshot-learning-output
    volumes:
      - ./models:/app/models
      - ./.cache/huggingface:/app/.cache/huggingface
    depends_on:
      - minio

volumes:
  minio_data:
