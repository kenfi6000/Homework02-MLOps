[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroshot-mlops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.41.1",
  "transformers==4.48.1",
  "torch==2.5.1",
  "huggingface-hub==0.27.1",
  "PyYAML==6.0.2",
  "minio==7.2.15",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-mock==3.14.0",
  "ruff==0.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
